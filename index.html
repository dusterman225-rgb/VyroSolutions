<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>VyqilAssistant</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <img src="images/logo.svg" alt="VyqilAssistant">
  <div class="t"><b>VyqilAssistant</b><span id="hhName">Loading...</span></div>
  <button class="ibtn" id="bellBtn" type="button" aria-label="Alerts" title="Alerts">&#128276;</button>
  <button class="ibtn" id="menuBtn" type="button" aria-label="Menu">&#9776;</button>
</header>
<main id="view"><div class="empty">Loading your household...</div></main>
<button class="fab" id="fab" type="button">+ Quick add</button>
<nav class="tabs" id="tabs">
  <button data-t="today"><i>&#127968;</i>Today</button>
  <button data-t="calendar"><i>&#128197;</i>Calendar</button>
  <button data-t="money"><i>&#128178;</i>Money</button>
  <button data-t="house"><i>&#128106;</i>Household</button>
  <button data-t="ask"><i>&#10024;</i>Ask</button>
</nav>
<div id="modalRoot"></div><div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/helpbot-config.js"></script>
<script src="js/core.js"></script>
<script src="js/forms.js"></script>
<script src="js/views.js"></script>
<script src="js/ai.js"></script>
<script src="js/push-config.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
