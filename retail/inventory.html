<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Inventory - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Inventory</div>
  </div>
  <div class="strip"><div><small>Products</small><b id="kP">-</b></div><div><small>Low or out</small><b id="kL">-</b></div><div><small>Stock value (cost)</small><b id="kV">-</b></div></div>
  <div class="card" style="margin-top:0">
    <input id="q" type="search" placeholder="Search name, barcode or SKU, or scan" style="width:100%;margin-bottom:8px">
    <button class="btn ghost" id="scanBtn" type="button" style="display:none">Scan with camera</button>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div><div class="note" id="none"></div>
    <button class="btn ghost" id="csv" type="button">Download stock list (spreadsheet)</button>
  </div>
  <details class="sec"><summary>Recent stock changes</summary><div class="in" id="log"><div class="note">Open to load.</div></div></details>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<div class="modal-bg" id="bg"><div class="modal" id="box"></div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script src="js/vcache.js"></script>
<script src="js/scan.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRetail(ctx) { if (ctx.biz.product && ctx.biz.product !== 'retail' && !(ctx.biz.apps && ctx.biz.apps.retail)) { location.replace('/contractor/app.html'); return false; } vtheme.load(ctx); return true; }
  function sheet(title, build) { var b = $('box'); b.textContent = ''; b.appendChild(vyro.el('h2', '', title)); build(b); $('bg').classList.add('open'); }
  function closeSheet() { $('bg').classList.remove('open'); }
  $('bg').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  function say(id, t, c) { $(id).textContent = t; $(id).className = 'note ' + (c || ''); }

  vyro.start(async function (ctx) {
    if (!onlyRetail(ctx)) return;
    var can = vroles.can(ctx, 'supply'), col = ctx.bizRef.collection('products'), logc = ctx.bizRef.collection('stockLog'), rows = [], filt = 'all';
    if (window.vscan && vscan.supported()) { $('scanBtn').style.display = 'block'; $('scanBtn').addEventListener('click', function () { vscan.open(function (v) { $('q').value = v; draw(); }); }); }
    function low(r) { return r.active !== false && (r.stock || 0) <= (r.lowAt || 0) && (r.lowAt || 0) > 0; }
    function out(r) { return r.active !== false && (r.stock || 0) <= 0; }
    async function load() {
      try { var s = await col.get(); rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }); } catch (e) { $('err').textContent = vyro.friendly(e); }
      rows.sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || ''), undefined, { numeric: true }); });
      var n = 0, v = 0, lo = 0; rows.forEach(function (r) { if (r.active === false) return; n++; v += Math.max(0, r.stock || 0) * (r.costCents || 0); if (low(r) || out(r)) lo++; });
      $('kP').textContent = n; $('kL').textContent = lo; $('kV').textContent = vutil.fmt(v); draw();
    }
    function draw() {
      var tb = $('tabs'); tb.textContent = '';
      [['all', 'All'], ['low', 'Low or out'], ['out', 'Out of stock']].forEach(function (f) { var b = vyro.el('button', filt === f[0] ? 'on' : '', f[1]); b.type = 'button'; b.addEventListener('click', function () { filt = f[0]; draw(); }); tb.appendChild(b); });
      var q = $('q').value.trim().toLowerCase();
      var list = rows.filter(function (r) { if (filt === 'low' && !(low(r) || out(r))) return false; if (filt === 'out' && !out(r)) return false; return !q || (String(r.name) + ' ' + (r.barcode || '') + ' ' + (r.sku || '')).toLowerCase().indexOf(q) >= 0; });
      var box = $('list'); box.textContent = ''; $('none').textContent = rows.length ? (list.length ? '' : 'Nothing here.') : 'No products yet. Add them under Products.';
      list.slice(0, 200).forEach(function (r) {
        var it = vyro.el('div', 'item'), l = vyro.el('div', 'grow'), b = vyro.el('b', '', r.name); l.appendChild(b);
        var st = r.stock || 0, tag = out(r) ? 'OUT' : low(r) ? 'LOW' : ''; var sm = vyro.el('small', '', st + ' in stock' + (r.lowAt ? ' · warn at ' + r.lowAt : '') + (r.barcode ? ' · ' + r.barcode : '') + (tag ? ' · ' + tag : '')); if (tag) sm.style.color = out(r) ? '#ff8a80' : '#ffb25c'; l.appendChild(sm); it.appendChild(l);
        if (can) {
          var rc = vyro.el('button', 'btn', 'Receive'), ct = vyro.el('button', 'btn ghost', 'Count'); rc.type = ct.type = 'button';
          rc.addEventListener('click', function () { change(r, 'receive'); }); ct.addEventListener('click', function () { change(r, 'count'); }); it.appendChild(rc); it.appendChild(ct);
        }
        box.appendChild(it);
      });
      if (list.length > 200) box.appendChild(vyro.el('div', 'note', 'Showing the first 200. Search to narrow it down.'));
    }
    $('q').addEventListener('input', draw);
    function change(r, mode) {
      sheet((mode === 'receive' ? 'Receive stock: ' : 'Count: ') + r.name, function (b) {
        b.appendChild(vyro.el('div', 'note', 'Now in stock: ' + (r.stock || 0)));
        var inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.step = '1'; inp.placeholder = mode === 'receive' ? 'How many arrived' : 'How many you counted on the shelf'; inp.style.width = '100%'; b.appendChild(inp);
        var why = document.createElement('select'); why.style.cssText = 'width:100%;margin-top:8px';
        (mode === 'receive' ? ['Delivery from vendor', 'Customer return', 'Transfer in', 'Other'] : ['Stock count', 'Damaged', 'Lost or stolen', 'Found', 'Transfer out', 'Other']).forEach(function (w) { var o = document.createElement('option'); o.textContent = w; why.appendChild(o); }); b.appendChild(why);
        var m = vyro.el('div', 'note', ''); b.appendChild(m);
        var go = vyro.el('button', 'btn', mode === 'receive' ? 'Add to stock' : 'Set the count'); go.type = 'button'; b.appendChild(go);
        var cx = vyro.el('button', 'btn ghost', 'Cancel'); cx.type = 'button'; cx.addEventListener('click', closeSheet); b.appendChild(cx);
        go.addEventListener('click', async function () {
          var n = parseFloat(inp.value); if (!isFinite(n) || (mode === 'receive' && n <= 0) || (mode === 'count' && n < 0)) { m.textContent = 'Enter a number.'; m.className = 'note err'; return; }
          n = Math.round(n); go.disabled = true;
          try {
            var ref = col.doc(r.id), after, delta;
            if (mode === 'receive') { delta = n; await ref.update({ stock: firebase.firestore.FieldValue.increment(n), updatedAt: vyro.stamp(), updatedBy: vyro.who(ctx) }); after = (r.stock || 0) + n; }
            else { delta = n - (r.stock || 0); await ref.update({ stock: n, updatedAt: vyro.stamp(), updatedBy: vyro.who(ctx) }); after = n; }
            try { await logc.add({ productId: r.id, name: r.name, change: delta, after: after, why: why.value, byName: vyro.who(ctx), byUid: ctx.user.uid, at: Date.now() }); } catch (e) {}
            r.stock = after; closeSheet(); await load(); vyro.audit(ctx, 'stock ' + mode, r.name + ' ' + delta);
          } catch (e) { m.textContent = vyro.friendly(e); m.className = 'note err'; go.disabled = false; }
        });
        setTimeout(function () { inp.focus(); }, 50);
      });
    }
    document.querySelector('details.sec').addEventListener('toggle', async function () {
      if (!this.open) return; var box = $('log'); box.textContent = 'Loading...';
      try { var s = await logc.orderBy('at', 'desc').limit(30).get(); box.textContent = ''; if (s.empty) box.appendChild(vyro.el('div', 'note', 'Nothing yet.'));
        s.forEach(function (d) { var x = d.data(), it = vyro.el('div', 'item'), l = vyro.el('div', 'grow'); l.appendChild(vyro.el('b', '', x.name + ': ' + (x.change > 0 ? '+' : '') + x.change)); l.appendChild(vyro.el('small', '', x.why + ' · ' + (x.byName || '') + ' · ' + new Date(x.at).toLocaleString() + ' · now ' + x.after)); it.appendChild(l); box.appendChild(it); });
      } catch (e) { box.textContent = vyro.friendly(e); }
    });
    $('csv').addEventListener('click', function () {
      function q(s) { s = String(s == null ? '' : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
      var out = [['Name', 'SKU', 'Barcode', 'Category', 'Price', 'Cost', 'In stock', 'Warn at', 'Vendor'].join(',')];
      rows.forEach(function (r) { out.push([q(r.name), q(r.sku), q(r.barcode), q(r.category), ((r.priceCents || 0) / 100).toFixed(2), ((r.costCents || 0) / 100).toFixed(2), r.stock || 0, r.lowAt || 0, q(r.vendor)].join(',')); });
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.join('\n')], { type: 'text/csv' })); a.download = 'stock-' + vutil.todayStr() + '.csv'; a.click();
    });
    await load();
  });

</script>
</body>
</html>
