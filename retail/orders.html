<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Order history - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Order history</div>
  </div>

  <div class="strip">
    <div><small>Orders</small><b id="sN">-</b></div>
    <div><small>Open</small><b id="sOpen">-</b></div>
    <div><small>Paid total</small><b id="sPaid">-</b></div>
  </div>
  <div class="card" style="margin-top:0">
    <label class="field"><span>Day</span><input id="day" type="date"></label>
    <div id="list"></div>
    <div class="note" id="empty"></div>
    <div class="note">Every sale from the day you pick, paid or not. Use this to find an order, print a receipt, or cancel one. To return items, use Refund on the sale.</div>
  </div>
  <div class="card" id="byMethod" style="display:none"></div>
  <a class="btn" href="quick.html">New order</a>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'retail' && !(ctx.biz.apps && ctx.biz.apps.retail)) { location.replace('/contractor/app.html'); return false; } vtheme.load(ctx); return true; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var staff = vroles.isStaff(ctx), col = ctx.bizRef.collection('orders'), rows = [];
    if (!staff) { document.querySelector('.strip div:last-child').style.display = 'none'; document.querySelector('.strip').style.gridTemplateColumns = 'repeat(2,1fr)'; }
    $('day').value = vutil.todayStr();
    $('day').addEventListener('change', load);
    var unsub = null;
    function load() {
      if (unsub) { unsub(); unsub = null; }
      unsub = col.where('dateKey', '==', $('day').value).onSnapshot(function (s) {
        rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        rows.sort(function (a, b) { return (a.number || '') < (b.number || '') ? 1 : -1; });
        draw();
      }, function (e) { $('err').textContent = vyro.friendly(e); rows = []; draw(); });
    }
    // Refund: money goes back by the same way the customer paid. Vyro records it; the manager hands back the money.
    async function refund(o) {
      var left = (o.totalCents || 0) - (o.refundedCents || 0), t = prompt('Refund how much? Order ' + (o.number || '') + ' can be refunded up to ' + vutil.fmt(left) + '.\nType the amount in dollars, or leave blank for the full ' + vutil.fmt(left) + '.');
      if (t === null) return; var c = t.trim() === '' ? left : vutil.toCents(t);
      if (!(c > 0) || c > left) { $('err').textContent = 'Enter an amount between $0.01 and ' + vutil.fmt(left) + '.'; return; }
      var why = prompt('Reason for the refund (optional):'); if (why === null) return;
      var pm = (o.payments && o.payments[0] && o.payments[0].method) || o.method || 'Other';
      var note = pm === 'Pay with Vyro' ? '\n\nThis was paid with crypto. Vyro records the refund; you must send the crypto back yourself from your wallet.' : (pm === 'Card' ? '\n\nRefund it on your card reader too.' : pm === 'Cash' ? '\n\nHand the customer the cash.' : '');
      if (!confirm('Refund ' + vutil.fmt(c) + ' on order ' + (o.number || '') + '?' + note)) return;
      var list = (o.refunds || []).concat([{ cents: c, reason: String(why || '').slice(0, 100), by: vyro.who(ctx), byUid: ctx.user.uid, atMs: Date.now(), method: pm }]);
      try { await col.doc(o.id).update({ refunds: list, refundedCents: (o.refundedCents || 0) + c, updatedAt: vyro.stamp() }); vyro.audit(ctx, 'refund', (o.number || '') + ' ' + vutil.fmt(c)); } catch (e) { $('err').textContent = vyro.friendly(e); return; }
      // Returned goods: put them back on the shelf count.
      try {
        var lines = (o.items || []).filter(function (l) { return l.productId; });
        if (lines.length && confirm('Put returned items back in stock?')) {
          var full = (o.refundedCents || 0) + c >= (o.totalCents || 0), done = {}; Object.keys(o.restocked || {}).forEach(function (k) { done[k] = o.restocked[k]; });
          var bt = vyro.db.batch(), any = false, FV = firebase.firestore.FieldValue;
          lines.forEach(function (l) {
            var max = (l.qty || 0) - (done[l.productId] || 0); if (max <= 0) return;
            var v = prompt('How many "' + l.name + '" are coming back? (0 to ' + max + ')', full ? String(max) : '0'); if (v === null) return;
            var n = Math.max(0, Math.min(max, Math.round(parseFloat(v) || 0))); if (!n) return;
            bt.update(ctx.bizRef.collection('products').doc(l.productId), { stock: FV.increment(n), updatedAt: vyro.stamp() });
            bt.set(ctx.bizRef.collection('stockLog').doc(), { productId: l.productId, name: l.name, change: n, why: 'Return, sale ' + (o.number || ''), byName: vyro.who(ctx), byUid: ctx.user.uid, at: Date.now() });
            done[l.productId] = (done[l.productId] || 0) + n; any = true;
          });
          if (any) { bt.update(col.doc(o.id), { restocked: done, updatedAt: vyro.stamp() }); await bt.commit(); }
        }
      } catch (e) { $('err').textContent = 'The refund was saved, but putting items back in stock failed: ' + vyro.friendly(e) + ' Fix the count in Inventory.'; }
    }
    function draw() {
      var box = $('list'); box.textContent = ''; var open = 0, paid = 0, tips = 0, n = 0, by = {};
      rows.forEach(function (o) {
        if (o.status !== 'Voided') n++; if (o.status === 'Open') open++;
        if (o.status === 'Paid') { paid += (o.totalCents || 0) - (o.refundedCents || 0); tips += o.tipCents || 0; (o.payments || [{ method: o.method || 'Other', amountCents: o.totalCents }]).forEach(function (p) { by[p.method || 'Other'] = (by[p.method || 'Other'] || 0) + (p.amountCents || 0); }); (o.refunds || []).forEach(function (r) { by[r.method || 'Other'] = (by[r.method || 'Other'] || 0) - (r.cents || 0); }); }
        var row = vyro.el('div', 'item'), left = vyro.el('div', 'grow');
        var top = vyro.el('b'); top.appendChild(vyro.el('span', 'pill ' + o.status, o.status === 'Voided' ? 'Cancelled' : o.status === 'Open' ? 'Unpaid' : o.status)); top.appendChild(document.createTextNode((o.number || '') + (o.label ? ' \u00b7 ' + o.label : '')));
        left.appendChild(top);
        left.appendChild(vyro.el('small', '', (o.items || []).map(function (i) { return i.qty + ' x ' + i.name + (i.modText ? ' (' + i.modText + ')' : ''); }).join(', ')));
        left.appendChild(vyro.el('small', '', [o.byName, o.status === 'Paid' ? o.method : '', o.refundedCents ? (o.refundedCents >= (o.totalCents || 0) ? 'REFUNDED ' : 'refunded ') + vutil.fmt(o.refundedCents) : '', o.tipCents ? 'tip ' + vutil.fmt(o.tipCents) : '', o.status !== 'Voided' ? (o.kitchenStatus === 'Hold' ? 'KIOSK - waiting for payment' : '') : ''].filter(Boolean).join(' \u00b7 ')));
        row.appendChild(left); row.appendChild(vyro.el('b', o.status === 'Voided' ? 'struck' : '', vutil.fmt(o.totalCents)));
        if (o.status === 'Paid') { var rc = vyro.el('a', 'btn ghost', 'Receipt'); rc.href = 'receipt.html?id=' + o.id; rc.style.marginTop = '0'; row.appendChild(rc); }
        if (o.status === 'Paid' && vroles.can(ctx, 'refund') && (o.refundedCents || 0) < (o.totalCents || 0)) {
          var rf = vyro.el('button', 'btn ghost', 'Refund'); rf.type = 'button'; rf.style.marginTop = '0';
          rf.addEventListener('click', function () { refund(o); }); row.appendChild(rf);
        }
        if (vroles.can(ctx, 'void') && o.status !== 'Voided') {
          var v = vyro.el('button', 'btn ghost', 'Cancel order'); v.type = 'button'; v.style.marginTop = '0';
          v.addEventListener('click', async function () {
            if (!confirm('Cancel order ' + (o.number || '') + '? It stays in the list but is not counted in your sales. This cannot be undone.')) return;
            try { await col.doc(o.id).update({ status: 'Voided', voidedBy: vyro.who(ctx), updatedAt: vyro.stamp() }); load(); } catch (e) { $('err').textContent = vyro.friendly(e); }
          });
          row.appendChild(v);
        }
        box.appendChild(row);
      });
      $('empty').textContent = rows.length ? '' : 'No orders on this day.';
      $('sN').textContent = n; $('sOpen').textContent = open; $('sPaid').textContent = vutil.fmt(paid);
      var bm = $('byMethod'); bm.textContent = '';
      if (staff && Object.keys(by).length) { bm.style.display = 'block'; bm.appendChild(vyro.el('h2', '', 'Collected by method (includes tips)')); if (tips) { var tr = vyro.el('div', 'row'); tr.appendChild(vyro.el('span', '', 'Tips today (to pay out)')); tr.appendChild(vyro.el('b', '', vutil.fmt(tips))); bm.appendChild(tr); } Object.keys(by).forEach(function (k) { var r = vyro.el('div', 'row'); r.appendChild(vyro.el('span', '', k)); r.appendChild(vyro.el('b', '', vutil.fmt(by[k]))); bm.appendChild(r); }); } else bm.style.display = 'none';
    }
    load();
  });
</script>
</body>
</html>
