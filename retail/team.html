<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Team - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Team and permissions</div>
  </div>

  <div class="card" style="margin-top:0">
    <div id="list"></div>
    <div id="invBox"></div>
    <div class="note" id="empty"></div>
  </div>
  <details class="sec" id="addSec" open>
    <summary id="formTitle">Add a team member</summary>
    <div class="in">
      <label class="field"><span>Name</span><input id="name" maxlength="80"></label>
      <label class="field"><span>Email (they get a link to set their password)</span><input id="email" type="email" maxlength="120"></label>
      <label class="field"><span>Role</span><select id="role"></select></label>
      <div id="roleNote" class="note" style="text-align:left"></div>
      <label class="field"><span>Job title (change it for a promotion or a new job)</span><input id="title" maxlength="40" placeholder="e.g. Cashier, Stock lead, Shift manager"></label>
      <div id="hoursBox">
        <label class="field"><span>Full time or part time</span><select id="empType"><option value="">Choose...</option><option value="full">Full time</option><option value="part">Part time</option></select></label>
        <label class="field"><span>Hours per week (you choose). Scheduling past this counts as overtime.</span><input id="wkHrs" type="number" min="1" max="80" step="0.5" inputmode="decimal"></label>
      </div>
      <div id="supBox" style="display:none">
        <div class="tabs" id="presets" style="flex-wrap:wrap"></div>
        <div id="perms"></div>
      </div>
      <button class="btn" id="save" type="button">Add</button>
      <button class="btn ghost" id="cancel" type="button" style="display:none">Cancel edit</button>
      <div class="note" id="msg"></div>
    </div>
  </details>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script src="js/vcache.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'retail' && !(ctx.biz.apps && ctx.biz.apps.retail)) { location.replace('/contractor/app.html'); return false; } vtheme.load(ctx); return true; }
  function deny(msg) { Array.prototype.forEach.call(document.querySelectorAll('.wrap > *'), function (n) { if (!n.classList.contains('brand') && !n.classList.contains('back') && n.id !== 'err') n.style.display = 'none'; }); $('err').textContent = msg || 'You do not have access to this page.'; }

  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    var R = vroles, owner = R.isOwnerLevel(ctx), trueOwner = ctx.role === 'owner';
    if (!R.can(ctx, 'team')) { deny('Only the owner, or a supervisor allowed to manage the team, can use this page.'); return; }
    var col = ctx.bizRef.collection('members'), rows = [], editing = null, perms = {};
    var NOTES = {
      employee: 'A cashier or team member can run checkout, look up products and stock, see the schedule and clock in.',
      gm: 'A general manager has the same powers as the owner, for this one store only. They cannot see your other locations or remove you.',
      supervisor: 'Supervisors can do everything a team member can. Choose what else they may do.'
    };
    var sel = $('role'); [['employee', 'Cashier / team member']].concat(owner ? [['supervisor', 'Supervisor']] : []).concat(trueOwner ? [['gm', 'General manager']] : []).forEach(function (r) { var o = document.createElement('option'); o.value = r[0]; o.textContent = r[1]; sel.appendChild(o); });
    function drawPerms() {
      var box = $('perms'); box.textContent = '';
      R.PERMS.forEach(function (p) {
        var l = document.createElement('label'); l.style.cssText = 'display:flex;gap:10px;align-items:center;margin:8px 0';
        var c = document.createElement('input'); c.type = 'checkbox'; c.style.width = 'auto'; c.checked = perms[p[0]] !== false; c.addEventListener('change', function () { perms[p[0]] = c.checked; });
        l.appendChild(c); l.appendChild(document.createTextNode(p[1])); box.appendChild(l);
      });
    }
    function setPerms(p) { perms = {}; R.PERMS.forEach(function (x) { perms[x[0]] = p[x[0]] !== false; }); drawPerms(); }
    var pb = $('presets'); Object.keys(R.PRESETS).forEach(function (n) { var b = vyro.el('button', 'tab', n); b.type = 'button'; b.addEventListener('click', function () { $('title').value = n; setPerms(R.PRESETS[n]); }); pb.appendChild(b); });
    function roleChange() { var r = sel.value; $('hoursBox').style.display = r === 'kiosk' ? 'none' : 'block'; $('roleNote').textContent = NOTES[r] || ''; $('supBox').style.display = r === 'supervisor' ? 'block' : 'none'; }
    $('empType').addEventListener('change', function () { if (!$('wkHrs').value || $('wkHrs').dataset.auto === '1') { $('wkHrs').value = this.value === 'full' ? 40 : this.value === 'part' ? 20 : ''; $('wkHrs').dataset.auto = '1'; } });
    $('wkHrs').addEventListener('input', function () { this.dataset.auto = '0'; });
    sel.addEventListener('change', roleChange); setPerms(R.PRESETS['Manager']); roleChange();
    function reset() { editing = null; $('name').value = ''; $('email').value = ''; $('email').disabled = false; $('title').value = ''; $('empType').value = ''; $('wkHrs').value = ''; sel.value = 'employee'; setPerms(R.PRESETS['Manager']); roleChange(); $('save').textContent = 'Add'; $('formTitle').textContent = 'Add a team member'; $('cancel').style.display = 'none'; }
    $('cancel').addEventListener('click', reset);
    // ---- people who were invited (they already had a Vyro login) and the message to send a new person ----
    async function signInLink() {
      try { var q = await vyro.db.collection('publicBrands').where('bizId', '==', ctx.bizId).limit(1).get(); if (!q.empty) return location.origin + '/' + q.docs[0].id + '/login'; } catch (e) {}
      return location.origin + '/' + 'retail' + '/login.html';
    }
    async function shareBlock(em, nm, invited) {
      var box = $('shareBox'); if (!box) { box = vyro.el('div', 'card'); box.id = 'shareBox'; $('msg').parentNode.insertBefore(box, $('msg').nextSibling); }
      box.textContent = ''; var link = await signInLink(), biz = ctx.biz.name || 'our business';
      var text = 'Hi ' + (nm || '') + ', you have been added to ' + biz + ' on Vyro.\n\nSign in here: ' + link + '\nYour email: ' + em + '\n' + (invited ? 'You already have a Vyro login, so sign in with it. You will see the invitation on your home screen. Tap Accept.' : 'First time? On that page tap "Forgot your password?" and set your own password.');
      box.appendChild(vyro.el('b', '', 'Send them their sign-in details'));
      box.appendChild(vyro.el('div', 'note', 'Automatic emails often land in spam, so send this message yourself as well.'));
      var m = vyro.el('a', 'btn ghost', 'Email it'); m.href = 'mailto:' + em + '?subject=' + encodeURIComponent('Your ' + biz + ' sign-in') + '&body=' + encodeURIComponent(text); m.style.cssText = 'display:block;text-align:center'; box.appendChild(m);
      var s = vyro.el('a', 'btn ghost', 'Text it'); s.href = 'sms:?&body=' + encodeURIComponent(text); s.style.cssText = 'display:block;text-align:center'; box.appendChild(s);
      var c = vyro.el('button', 'btn ghost', 'Copy the message'); c.type = 'button'; c.addEventListener('click', async function () { try { await navigator.clipboard.writeText(text); c.textContent = 'Copied'; } catch (e) { c.textContent = 'Press and hold the text to copy'; } }); box.appendChild(c);
    }
    async function loadInvites() {
      var box = $('invBox'); if (!box) return; box.textContent = '';
      try {
        var s = await vyro.db.collection('invites').where('bizId', '==', ctx.bizId).get(); if (s.empty) return;
        var h = vyro.el('h2', '', 'Invited, not accepted yet'); h.style.cssText = 'margin:14px 0 4px;font-size:1rem'; box.appendChild(h);
        box.appendChild(vyro.el('div', 'note', 'These people already have a Vyro login. They appear on your team after they sign in and accept.'));
        s.forEach(function (d) {
          var x = d.data(), row = vyro.el('div', 'item'), l = vyro.el('div', 'grow'); l.appendChild(vyro.el('b', '', (x.name || x.email))); l.appendChild(vyro.el('small', '', x.email + ' · ' + R.label(x.role) + (x.title ? ' · ' + x.title : ''))); row.appendChild(l);
          var a = vyro.el('button', 'btn ghost', 'Message'); a.type = 'button'; a.addEventListener('click', function () { shareBlock(x.email, x.name, true); $('shareBox').scrollIntoView(); }); row.appendChild(a);
          var z = vyro.el('button', 'btn ghost', 'Cancel'); z.type = 'button'; z.addEventListener('click', async function () { if (!confirm('Cancel the invitation for ' + x.email + '?')) return; try { await d.ref.delete(); loadInvites(); } catch (e) { $('err').textContent = vyro.friendly(e); } }); row.appendChild(z);
          box.appendChild(row);
        });
      } catch (e) { /* the list of invitations is optional */ }
    }
    async function load() {
      try { var s = await col.get(); rows = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }); } catch (e) { $('err').textContent = vyro.friendly(e); }
      var order = { owner: 0, supervisor: 1 }; rows.sort(function (a, b) { var x = (order[a.role] != null ? order[a.role] : 2) - (order[b.role] != null ? order[b.role] : 2); return x || ((a.name || '') < (b.name || '') ? -1 : 1); });
      var box = $('list'); box.textContent = '';
      rows.forEach(function (m) {
        var row = vyro.el('div', 'item'), left = vyro.el('div', 'grow');
        left.appendChild(vyro.el('b', '', vyro.nameOf(m) + (m.id === ctx.user.uid ? ' (you)' : '')));
        left.appendChild(vyro.el('small', '', R.label(m.role) + (m.title ? ' \u00b7 ' + m.title : '') + (m.empType ? ' \u00b7 ' + (m.empType === 'full' ? 'Full time' : 'Part time') + ' ' + (m.weeklyHours || '') + 'h' : (m.role === 'kiosk' ? '' : ' \u00b7 hours not set')) + ' \u00b7 ' + (m.email || '')));
        row.appendChild(left);
        var canTouch = m.role !== 'owner' && m.id !== ctx.user.uid && (trueOwner || (m.role !== 'gm' && (owner || m.role !== 'supervisor')));
        if (canTouch) { var e = vyro.el('button', 'btn ghost', 'Edit / change title'); e.type = 'button'; e.style.marginTop = '0'; e.addEventListener('click', function () { startEdit(m); }); row.appendChild(e); }
        if (canTouch) { var x = vyro.el('button', 'btn ghost', 'Remove'); x.type = 'button'; x.style.marginTop = '0';
          x.addEventListener('click', async function () { if (!confirm('Remove ' + vyro.nameOf(m) + '? They will no longer be able to open the store.')) return; try { await col.doc(m.id).delete(); vcache.bump(ctx, 'members'); vyro.audit(ctx, 'member removed', m.email); load(); } catch (er) { $('err').textContent = vyro.friendly(er); } });
          row.appendChild(x); }
        box.appendChild(row);
      });
    }
    function startEdit(m) {
      editing = m.id; $('name').value = m.name || ''; $('email').value = m.email || ''; $('email').disabled = true; sel.value = m.role; $('title').value = m.title || ''; $('empType').value = m.empType || ''; $('wkHrs').value = m.weeklyHours || ''; $('wkHrs').dataset.auto = '0';
      setPerms(m.perms || (m.role === 'supervisor' ? R.PRESETS['General manager'] : {})); roleChange();
      $('save').textContent = 'Save changes'; $('formTitle').textContent = 'Edit ' + vyro.nameOf(m); $('cancel').style.display = 'block'; $('addSec').open = true; $('addSec').scrollIntoView();
    }
    $('save').addEventListener('click', async function () {
      var n = $('name').value.trim(), em = $('email').value.trim().toLowerCase(), role = sel.value, btn = this;
      if (!n || (!editing && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))) { $('msg').textContent = 'Enter a name and a valid email.'; $('msg').className = 'note err'; return; }
      var hrs = parseFloat($('wkHrs').value), et = $('empType').value;
      if (role !== 'kiosk' && (!et || !(hrs > 0 && hrs <= 80))) { $('msg').textContent = 'Choose full time or part time and the hours per week (1 to 80).'; $('msg').className = 'note err'; return; }
      var extra = { title: $('title').value.trim().slice(0, 40) }; if (role !== 'kiosk') { extra.empType = et; extra.weeklyHours = hrs; } if (role === 'supervisor') { extra.perms = {}; R.PERMS.forEach(function (p) { extra.perms[p[0]] = perms[p[0]] !== false; }); }
      btn.disabled = true; $('msg').textContent = 'Saving...'; $('msg').className = 'note';
      try {
        if (editing) {
          var upd = { name: n, role: role, title: extra.title }; if (role !== 'kiosk') { upd.empType = extra.empType; upd.weeklyHours = extra.weeklyHours; } if (owner) upd.perms = role === 'supervisor' ? extra.perms : {};
          await col.doc(editing).update(upd); vcache.bump(ctx, 'members'); vyro.audit(ctx, 'member changed', em + ' ' + role); $('msg').textContent = 'Saved.'; $('msg').className = 'note ok';
        } else {
          var r = await vyro.addMember(ctx.bizId, em, n, role, extra); vcache.bump(ctx, 'members'); vyro.audit(ctx, 'member added', em + ' ' + role);
          $('msg').textContent = r.invited ? 'That email already has a Vyro login. They were sent an invitation: when they sign in, they will see it on their home screen and can accept it. They keep their other job.' : r.emailSent ? 'Added. They were emailed a link to set their password.' : 'Added, but the email could not be sent. Ask them to use "Forgot password" on the sign-in page.'; $('msg').className = 'note ok';
        }
        var wasAdd = !editing; var sh = { em: em, n: n, inv: false }; reset(); load(); loadInvites();
        if (wasAdd) { shareBlock(em, n, !!(typeof r !== 'undefined' && r && r.invited)); }
      } catch (e) { $('msg').textContent = vyro.friendly(e); $('msg').className = 'note err'; }
      btn.disabled = false;
    });
    load(); loadInvites();
  });
</script>
</body>
</html>
