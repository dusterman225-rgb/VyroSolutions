<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Create account - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Vyro home"></a>
    <div class="tag">Create your business account</div>
  </div>

  <form class="card" id="f">
    <h2>Get started</h2>
    <label class="field"><span>Business name</span><input id="biz" type="text" placeholder="Smith Construction" autocomplete="organization" required></label>
    <label class="field"><span>Email</span><input id="email" type="email" placeholder="you@company.com" autocomplete="email" required></label>
    <label class="field"><span>Password (8+ characters)</span><input id="pw" type="password" placeholder="Password" autocomplete="new-password" required></label>
    <button class="btn" id="go" type="submit">Create account</button>
    <div class="note" id="msg"></div>
    <a class="link" href="login.html">Already have an account? Sign in</a>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  vyro.redirectIfSignedIn();
  var PRODUCTS = { contractor: 'VyroContractor' };
  var product = new URLSearchParams(location.search).get('product');
  if (!PRODUCTS[product]) { location.replace('choose.html'); }
  else { document.querySelector('.tag').textContent = 'Sign up for ' + PRODUCTS[product]; }
  var msg = document.getElementById('msg');
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var biz = document.getElementById('biz').value.trim();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('pw').value;
    msg.className = 'note';
    if (!biz) { msg.textContent = 'Enter your business name.'; msg.className = 'note err'; return; }
    if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; msg.className = 'note err'; return; }
    var btn = document.getElementById('go');
    btn.disabled = true; msg.textContent = 'Creating your account...';
    try {
      await vyro.signUp(email, pw, biz, product);
      location.href = 'app.html';
    } catch (err) {
      msg.textContent = vyro.friendly(err); msg.className = 'note err'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
