<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Assistant - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;height:100dvh;background:#05070A}
  .chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1c2530;background:#0a0f16;flex:0 0 auto}
  .chat-head a.back-arrow{color:inherit;text-decoration:none;font-size:1.4rem;line-height:1;padding:4px 8px 4px 0}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#4ba3ff,#7fd0ff);display:flex;align-items:center;justify-content:center;color:#031018;font-weight:800;flex:0 0 auto;position:relative}
  .avatar i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ddc84;border:2px solid #0a0f16}
  .chat-head b{display:block;font-size:1rem}
  .chat-head small{display:block;opacity:.7;font-size:.78rem}
  #log{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
  .row2{display:flex;gap:8px;max-width:100%}
  .row2.me{justify-content:flex-end}
  .row2 .avatar{width:28px;height:28px;font-size:.72rem;align-self:flex-end}
  .bub{max-width:82%;padding:10px 13px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:.93rem}
  .bot .bub{background:#161d27;border-bottom-left-radius:5px}
  .me .bub{background:#2b7bd8;color:#fff;border-bottom-right-radius:5px}
  .ts{display:block;font-size:.68rem;opacity:.55;margin-top:5px}
  .ts a{color:inherit;margin-left:8px}
  .typing .bub{display:flex;gap:5px;padding:14px 16px}
  .typing .bub span{width:7px;height:7px;border-radius:50%;background:#8aa0b8;animation:blink 1.2s infinite}
  .typing .bub span:nth-child(2){animation-delay:.2s}.typing .bub span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px 50px}
  .chips button{border:1px solid #2f4a68;background:transparent;color:#cfe6ff;border-radius:999px;padding:8px 13px;font-size:.84rem}
  .composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1c2530;background:#0a0f16}
  .composer textarea{flex:1;resize:none;max-height:120px;border-radius:20px;padding:10px 14px;margin:0;min-height:42px;box-sizing:border-box}
  .composer button{border:0;border-radius:50%;width:42px;height:42px;background:#2b7bd8;color:#fff;font-size:1.1rem;flex:0 0 auto}
  .composer button:disabled{opacity:.4}
  .fine{font-size:.68rem;opacity:.55;text-align:center;padding:0 12px 6px}
  #err{padding:0 14px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="chat-head">
    <a class="back-arrow" href="app.html" aria-label="Back to dashboard">&#8249;</a>
    <div class="avatar" id="hAv">V<i></i></div>
    <div><b id="hName">Vyro Assistant</b><small id="hSub">Online</small></div>
  </div>

  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <div class="note err" id="err"></div>
  <div class="fine">AI can make mistakes. Check amounts before relying on them. I can read your records but can't change anything.</div>
  <div class="composer">
    <textarea id="q" rows="1" maxlength="800" placeholder="Type your question..."></textarea>
    <button id="send" type="button" aria-label="Send">&#10148;</button>
  </div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>window.__vyroHelpbot = true;</script>
<script src="../shared/helpbot-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script>
  var ASSISTANT_NAME = 'Vyro Assistant';   // change this word to rename the assistant
  var $ = function (id) { return document.getElementById(id); };
  function clock() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

  vyro.start(async function (ctx) {
    var biz = ctx.biz.name || 'your business';
    $('hName').textContent = ASSISTANT_NAME;
    $('hSub').textContent = 'AI assistant for ' + biz + ' · Online';
    $('hAv').firstChild.nodeValue = ASSISTANT_NAME.charAt(0);
    var base = (window.VYRO_HELP_URL || '').replace(/\/+$/, '');
    var hist = [], busy = false;

    function bubble(who, text, extra) {
      var row = vyro.el('div', 'row2 ' + who);
      if (who === 'bot') { var av = vyro.el('div', 'avatar', ASSISTANT_NAME.charAt(0)); row.appendChild(av); }
      var b = vyro.el('div', 'bub'); b.appendChild(document.createTextNode(text));
      var ts = vyro.el('span', 'ts', clock()); b.appendChild(ts);
      row.appendChild(b); $('log').appendChild(row); $('log').scrollTop = $('log').scrollHeight;
      return { row: row, bub: b, ts: ts };
    }
    function typing() {
      var row = vyro.el('div', 'row2 bot typing'); row.appendChild(vyro.el('div', 'avatar', ASSISTANT_NAME.charAt(0)));
      var b = vyro.el('div', 'bub'); b.appendChild(vyro.el('span')); b.appendChild(vyro.el('span')); b.appendChild(vyro.el('span'));
      row.appendChild(b); $('log').appendChild(row); $('log').scrollTop = $('log').scrollHeight; return row;
    }

    // greeting, like a live chat
    var t0 = typing();
    setTimeout(function () {
      t0.remove();
      bubble('bot', 'Hi! My name is ' + ASSISTANT_NAME + ', the AI assistant for ' + biz + '. How can I help you today?');
      var tips = ['What is overdue?', 'Who owes me the most?', 'What jobs are active?', 'What needs my attention this week?', 'Draft a payment reminder'];
      tips.forEach(function (t) { var x = vyro.el('button', '', t); x.type = 'button'; x.addEventListener('click', function () { $('q').value = t === 'Draft a payment reminder' ? 'Draft a polite payment reminder for my most overdue invoice' : t; go(); }); $('chips').appendChild(x); });
    }, 700);

    if (!base || /PUT-YOUR/.test(base)) { $('err').textContent = 'The assistant is not connected yet (js/helpbot-config.js).'; $('send').disabled = true; return; }

    async function go() {
      var t = $('q').value.trim(); if (!t || busy) return;
      busy = true; $('send').disabled = true; $('chips').style.display = 'none'; $('err').textContent = '';
      $('q').value = ''; $('q').style.height = 'auto';
      bubble('me', t); hist.push({ role: 'user', content: t });
      var wait = typing();
      try {
        var token = await vyro.auth.currentUser.getIdToken();
        var r = await fetch(base + '/assistant', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ messages: hist, today: vutil.todayStr() }) });
        var d = await r.json();
        if (r.status === 429) throw { friendly: 'You have reached today\'s assistant limit for your business. It resets tomorrow.' };
        if (r.status === 401 || r.status === 403) throw { friendly: 'I could not open your records. Please sign out and back in, then try again.', reason: d.detail || d.error || ('status ' + r.status) };
        if (!d.reply) throw { detail: d.detail || d.error || ('status ' + r.status) };
        var text = d.reply.replace(/\*\*/g, '').replace(/^#+\s*/gm, '');
        wait.remove();
        var m = bubble('bot', text); hist.push({ role: 'assistant', content: text });
        var a = vyro.el('a', '', 'Copy'); a.href = '#';
        a.addEventListener('click', function (e) { e.preventDefault(); try { navigator.clipboard.writeText(text); a.textContent = 'Copied'; } catch (x) { a.textContent = 'Could not copy'; } });
        m.ts.appendChild(a);
      } catch (e) {
        wait.remove(); hist.pop();
        var det = (e && e.detail) || (e && e.friendly ? '' : 'could not reach the helper. Check the address in js/helpbot-config.js.');
        // The reason line holds no secrets (for example "model-id-not-set"), so it is always shown on this page.
        var why = (e && e.reason) || det;
        bubble('bot', ((e && e.friendly) || 'Sorry, I\'m unavailable right now. Please try again in a minute.') + (why ? '\n\n[Reason: ' + why + ']' : ''));
      }
      busy = false; $('send').disabled = false; $('q').focus();
    }
    $('send').addEventListener('click', go);
    $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
    $('q').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
  });
</script>
</body>
</html>
