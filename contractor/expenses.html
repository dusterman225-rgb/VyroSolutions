<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Expenses - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="app.html"><img class="mark-small" src="images/logo.svg" alt="Back to dashboard"></a>
    <div class="tag">Expenses and bills</div>
  </div>

  <div class="strip">
    <div><small>This month</small><b id="sMonth">-</b></div>
    <div><small>Owed</small><b id="sOwe">-</b></div>
    <div><small>Overdue</small><b id="sOver">-</b></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="card" style="margin-top:0">
    <input class="search" id="q" type="search" placeholder="Search description, vendor, category or job" autocomplete="off">
    <div id="list"></div>
    <div class="note" id="empty"></div>
  </div>
  <a class="btn" href="expense.html">Add expense or bill</a>
  <a class="back" href="app.html">Back to dashboard</a>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script>window.VYRO_STAFF_ONLY = true;</script>
<script src="js/auth.js"></script>
<script>
  var TABS = ['All', 'Unpaid', 'Paid'];
  var $ = function (id) { return document.getElementById(id); };
  var today = vutil.todayStr();
  function disp(x) { return x.status === 'Unpaid' && x.dueDate && x.dueDate < today ? 'Overdue' : x.status; }

  vyro.start(async function (ctx) {
    var all = [], filter = 'All';
    function inTab(x, t) {
      if (t === 'All') return true;
      if (t === 'Unpaid') return x.status === 'Unpaid';
      return disp(x) === t;
    }

    function render() {
      var tabs = $('tabs'); tabs.textContent = '';
      TABS.forEach(function (t) {
        var n = all.filter(function (x) { return inTab(x, t); }).length;
        var b = vyro.el('button', 'tab' + (filter === t ? ' on' : ''), t + ' ' + n); b.type = 'button';
        b.addEventListener('click', function () { filter = t; render(); });
        tabs.appendChild(b);
      });

      var month = today.slice(0, 7), spent = 0, owe = 0, over = 0;
      all.forEach(function (x) {
        if ((x.date || '').slice(0, 7) === month) spent += x.amountCents || 0;
        if (x.status === 'Unpaid') { owe += x.amountCents || 0; if (disp(x) === 'Overdue') over++; }
      });
      $('sMonth').textContent = vutil.fmt(spent); $('sOwe').textContent = vutil.fmt(owe);
      $('sOver').textContent = over; if (over) $('sOver').className = 'late';

      var q = $('q').value.trim().toLowerCase();
      var box = $('list'); box.textContent = '';
      var shown = all.filter(function (x) {
        if (!inTab(x, filter)) return false;
        if (!q) return true;
        return [x.description, x.vendor, x.category, x.jobLabel].join(' ').toLowerCase().indexOf(q) > -1;
      });
      $('empty').textContent = shown.length ? '' : (all.length ? 'Nothing matches.' : 'No expenses yet. Tap Add expense or bill.');

      shown.forEach(function (x) {
        var d = disp(x);
        var row = vyro.el('div', 'item');
        var left = vyro.el('div', 'grow');
        var top = vyro.el('b'); top.appendChild(vyro.el('span', 'pill ' + d, d)); top.appendChild(document.createTextNode(x.description));
        left.appendChild(top);
        left.appendChild(vyro.el('small', '', [x.vendor, x.category, x.date, x.jobLabel || 'Overhead'].filter(Boolean).join(' \u00b7 ')));
        left.addEventListener('click', function () { location.href = 'expense.html?id=' + x.id; });
        row.appendChild(left);
        row.appendChild(vyro.el('b', d === 'Overdue' ? 'late' : '', vutil.fmt(x.amountCents)));
        box.appendChild(row);
      });
    }

    try {
      var snap = await ctx.bizRef.collection('expenses').orderBy('date', 'desc').get();
      all = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      render();
    } catch (e) { $('err').textContent = vyro.friendly(e); }
    $('q').addEventListener('input', render);
  });
</script>
</body>
</html>
