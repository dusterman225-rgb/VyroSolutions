<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Sign in - VyroContractor</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="app.html"><img class="mark-small" src="images/logo.svg" alt="Home"></a>
    <div class="tag" id="tag">VyroContractor</div>
  </div>
  <div id="brandBox" style="display:none;text-align:center;margin:8px 0 4px">
    <img id="brandLogo" alt="" style="max-height:72px;max-width:70%;display:none;margin:0 auto 8px">
    <h1 id="brandName" style="margin:0 0 4px"></h1><div class="note" id="brandTag"></div>
  </div>

  <div id="loginSwitch"></div>
  <div id="signedIn" class="card" style="display:none"><div class="note" id="siNote"></div>
    <button class="btn" id="siGo" type="button">Continue</button>
    <button class="btn ghost" id="siOut" type="button">Sign out and use another account</button></div>
  <form class="card" id="f">
    <h2 id="formHead">Owner sign in</h2>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Sign in</button>
    <button class="link" id="forgot" type="button">Forgot your password?</button>
    <div class="note" id="msg"></div>
  </form>
  <div class="note" id="staffNote" style="text-align:center">Team member or customer? Use your contractor's own sign-in link. Ask them for it.</div>
  <a class="back" id="portalLink" href="portal-login.html" style="display:none">Customer? Open your project portal</a>
  <a class="back" id="newLink" href="choose.html">New contractor? Create an account</a>
  <div style="text-align:center;margin:10px 0"><span id="vInstall"></span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="../shared/loginnav.js"></script>
<script src="../shared/install.js"></script>
<script>
  var KIND = 'contractor', KIND_NAME = 'VyroContractor';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, c) { $('msg').textContent = t; $('msg').className = 'note ' + (c || ''); }
  var brand = null, slug = (new URLSearchParams(location.search).get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  var ready = null;
  // A business's own link (login.html?r=name, shown as /name/login) shows its name and colours. Staff and customers use only these.
  async function loadBrand() {
    if (!slug) return;
    try {
      var d = await vyro.db.collection('publicBrands').doc(slug).get();
      if (!d.exists) { $('f').style.display = 'none'; $('staffNote').style.display = 'none'; say('That sign-in link was not found. Check it with your manager.', 'err'); $('newLink').style.display = 'none'; return; }
      brand = d.data(); brand.slug = slug;
      if (brand.product && brand.product !== KIND && /^(restaurant|takeout|retail|contractor)$/.test(brand.product)) { location.replace('/' + brand.product + '/login.html?r=' + encodeURIComponent(slug)); return; }
      $('brandName').textContent = brand.name; $('brandTag').textContent = brand.tagline || ''; $('brandBox').style.display = 'block';
      $('formHead').textContent = 'Sign in to ' + brand.name; $('tag').textContent = brand.name; $('staffNote').style.display = 'none'; $('newLink').style.display = 'none'; $('portalLink').href = 'portal-login.html?r=' + encodeURIComponent(slug); $('portalLink').style.display = 'block';
      document.title = 'Sign in - ' + brand.name;
      if (/^https:\/\//.test(brand.logoUrl || '')) { $('brandLogo').src = brand.logoUrl; $('brandLogo').style.display = 'block'; }
      if (brand.accent && brand.bg && brand.text && window.vtheme) { try { vtheme.apply({ accent: brand.accent, bg: brand.bg, text: brand.text }); } catch (e) {} }
    } catch (e) { say('Could not load this sign-in page. Check your connection.', 'err'); }
  }
  ready = loadBrand();
  // Someone already signed in on this site (for example from the Vyro owner page): offer to continue, or switch account.
  vyro.auth.onAuthStateChanged(async function (u) {
    if (!u || window.__busy) return; await ready;
    if (slug && !brand) return;
    try {
      if (brand) {
        var role = await vyro.enterBusiness(brand.bizId);
        if (role) { location.replace('app.html'); return; }
        $('siNote').textContent = 'You are signed in as ' + u.email + ', but that account is not on ' + brand.name + "'s team.";
        $('siGo').style.display = 'none';
      } else {
        $('siNote').textContent = 'You are signed in as ' + u.email + '.';
        $('siGo').onclick = function () { location.replace('app.html'); };
      }
      $('signedIn').style.display = 'block'; $('f').style.display = 'none';
      $('siOut').onclick = async function () { await vyro.signOut(); location.reload(); };
    } catch (e) { /* show the normal form */ }
  });
  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var em = $('email').value.trim(), pw = $('pw').value;
    if (!em || !pw) { say('Enter your email and password.', 'err'); return; }
    $('go').disabled = true; say('Signing in...'); window.__busy = true;
    try {
      if (brand) {
        var cu = await vyro.signIn(em, pw), role = await vyro.enterBusiness(brand.bizId);
        if (!role) { await vyro.signOut(); throw { msg: 'That login is not on ' + brand.name + "'s team. Check the email, or ask your manager to add you." }; }
      } else {
        var u = await vyro.signInAs(KIND, em, pw), r2 = await vyro.currentRole();
        if (r2 !== 'owner') { await vyro.signOut(); throw { msg: 'Team members sign in with their business link (ask your manager for it). This page is for owners.' }; }
      }
      location.href = 'app.html';
    }
    catch (err) { window.__busy = false; say(err && err.msg ? err.msg : vyro.friendly(err), 'err'); $('go').disabled = false; }
  });
  $('forgot').addEventListener('click', async function () {
    var em = $('email').value.trim();
    if (!em) { say('Type your email above first.', 'err'); return; }
    try { await vyro.resetPassword(em); } catch (err) { /* keep the message neutral */ }
    say('If that email has an account, a reset link is on its way. Check spam too.');
  });
</script>
</body>
</html>
