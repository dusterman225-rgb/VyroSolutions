<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Pickup board - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/clean.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Back to home"></a>
    <div class="tag">Pickup board</div>
  </div>
  <div class="note" style="text-align:center">This is the customer screen. Leave it open on a TV or tablet at the counter. Customers watch for their order number to turn READY.</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="card" style="flex:1;min-width:150px"><h2>Preparing</h2><div id="prep" style="display:flex;flex-wrap:wrap;gap:10px"></div></div>
    <div class="card" style="flex:1;min-width:150px"><h2 style="color:#7fe3b0">READY</h2><div id="ready" style="display:flex;flex-wrap:wrap;gap:10px"></div></div>
  </div>
  <a class="back" href="index.html">Back to home</a>
  <div class="note err" id="err"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function onlyRestaurant(ctx) { if (ctx.biz.product && ctx.biz.product !== 'restaurant' && !(ctx.biz.apps && ctx.biz.apps.restaurant)) { location.replace('/contractor/app.html'); return false; } vtheme.load(ctx); return true; }
  vyro.start(async function (ctx) {
    if (!onlyRestaurant(ctx)) return;
    try { var wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    function tick() { Array.prototype.forEach.call(document.querySelectorAll('.rtimer'), function (n) { var s = Math.max(0, Math.floor((Date.now() - Number(n.dataset.t)) / 1000)), m = Math.floor(s / 60); n.textContent = 'waiting ' + m + ':' + String(s % 60).padStart(2, '0'); n.style.color = m >= 10 ? '#ff6b6b' : m >= 5 ? '#ffb25c' : '#7fe3b0'; }); }
    setInterval(tick, 1000);
    ctx.bizRef.collection('orders').where('dateKey', '==', vutil.todayStr()).onSnapshot(function (s) {
      var prep = $('prep'), rd = $('ready'); prep.textContent = ''; rd.textContent = '';
      var list = s.docs.map(function (d) { return d.data(); }).filter(function (o) { return o.status !== 'Voided' && o.kitchenStatus && o.kitchenStatus !== 'Hold' && o.kitchenStatus !== 'Served' && !o.tableName; }).sort(function (a, b) { return (a.clientAt || 0) - (b.clientAt || 0); });
      list.forEach(function (o) {
        var wrap = vyro.el('div'), b = vyro.el('b', '', o.number || ''); wrap.style.textAlign = 'center'; b.style.cssText = 'display:block;font-size:2rem;padding:8px 14px;border-radius:12px;border:2px solid ' + (o.kitchenStatus === 'Ready' ? '#7fe3b0' : '#ffb25c'); wrap.appendChild(b);
        if (o.kitchenStatus === 'Ready') { var tm = vyro.el('small', 'rtimer', ''); tm.dataset.t = String(o.readyAtMs || (o.updatedAt && o.updatedAt.toMillis ? o.updatedAt.toMillis() : Date.now())); tm.style.cssText = 'display:block;margin-top:4px;font-weight:700'; wrap.appendChild(tm); }
        (o.kitchenStatus === 'Ready' ? rd : prep).appendChild(wrap);
      });
      tick();
    }, function (e) { $('err').textContent = vyro.friendly(e); });
  });
</script>
</body>
</html>
