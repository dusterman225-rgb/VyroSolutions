<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Vyro</title>
<link rel="icon" href="restaurant/images/logo.svg" type="image/svg+xml">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070A;color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:24px}a{color:#6FB6EA;font-weight:700}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div><h2 id="t">Finding your sign-in page...</h2><p id="m"></p><p><a href="/index.html">Go to Vyro</a></p></div>
<!-- Every Vyro business gets its own address: yourdomain/<business>/login. Cloudflare serves this page for any address that is not a real file,
     so this page looks the business up and sends the person to the right app's sign-in page. -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-config.js"></script>
<script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean), slug = (parts[0] || '').toLowerCase(), rest = (parts[1] || '').toLowerCase();
    var t = document.getElementById('t'), m = document.getElementById('m');
    function none() { t.textContent = 'Page not found'; m.textContent = 'Check the address, or ask the business for their Vyro sign-in link.'; }
    if (/^(restaurant|takeout|contractor)$/.test(slug) || /^(restaurant|takeout|contractor)$/.test(slug.replace(/\.html$/, ''))) {
      t.textContent = 'This page is missing from the website';
      m.textContent = 'The "' + slug + '" folder (with all its files) did not get uploaded to GitHub, or Cloudflare has not finished deploying it. Open your GitHub repository and check that the folder "' + slug + '" is there and has files inside, then wait a minute for Cloudflare to redeploy.';
      return;
    }
    if (!/^[a-z0-9]{3,30}$/.test(slug) || (rest && rest !== 'login')) { none(); return; }
    try {
      if (!firebase.apps.length) firebase.initializeApp(window.VYRO_FIREBASE_CONFIG);
      firebase.firestore().collection('publicBrands').doc(slug).get().then(function (d) {
        if (!d.exists) { none(); return; }
        var p = d.data().product; if (p !== 'takeout' && p !== 'contractor') p = 'restaurant';
        location.replace('/' + p + '/login.html?r=' + encodeURIComponent(slug));
      }).catch(none);
    } catch (e) { none(); }
  })();
</script>
</body>
</html>
