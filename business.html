<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#05070A">
<title>Business - Vyro Network</title>
<link rel="stylesheet" href="css/net.css"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head><body><div class="wrap">


<div class="top"><a class="brand" href="dashboard.html">&larr; VYRO NETWORK</a></div>
<h1 id="bname">Business</h1><div class="note" id="brole"></div>
<div class="note err" id="err"></div><div class="note ok" id="msg"></div>
<div id="closed" class="banner hide">This business is closed. Its data is kept. The owner can reopen it.</div>
<div class="tabs" id="tabs"></div>
<div id="p_over" class="card"></div>
<div id="p_team" class="card hide"></div>
<div id="p_apps" class="card hide"></div>
<div id="p_plan" class="card hide"></div>
<div id="p_store" class="card hide"></div>
<div id="p_act" class="card hide"></div>
<div id="p_data" class="card hide"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-config.js"></script><script src="js/net-config.js"></script><script src="js/net.js"></script>
<script>

var $=function(i){return document.getElementById(i)}, U, ws, tabs=[['over','Overview'],['team','Team'],['apps','Apps'],['plan','Plan'],['store','Storage'],['act','Activity'],['data','Data']];
function msg(t,bad){ $(bad?'err':'msg').textContent=t; $(bad?'msg':'err').textContent=''; }
function row(a,b,right){ var r=vnet.el('div','row'), d=vnet.el('div'); d.appendChild(vnet.el('b','',a)); if(b) d.appendChild(vnet.el('small','',b)); r.appendChild(d); if(right) r.appendChild(right); return r; }
function btn(t,c,f){ var b=vnet.el('button','btn '+(c||''),t); b.type='button'; b.onclick=f; return b; }
function guard(f){ return async function(){ try{ await f.apply(null,arguments); }catch(e){ msg(vnet.friendly(e),true); } }; }
var admin, owner;
function show(id){ tabs.forEach(function(t){ $('p_'+t[0]).classList.toggle('hide',t[0]!==id); }); Array.prototype.forEach.call($('tabs').children,function(b){ b.classList.toggle('on',b.dataset.id===id); }); if(R[id]) R[id](); }
var R={
 over:function(){ var p=$('p_over'); p.textContent=''; p.appendChild(vnet.el('h2','','Business profile'));
   var f=[['name','Business name'],['type','Type'],['country','Country'],['timezone','Time zone'],['currency','Currency']], inp={};
   f.forEach(function(x){ var l=vnet.el('label','',x[1]); var i=document.createElement('input'); i.value=ws.biz[x[0]]||''; i.disabled=!admin; i.maxLength=80; inp[x[0]]=i; p.appendChild(l); p.appendChild(i); });
   if(admin) p.appendChild(btn('Save','',guard(async function(){ var patch={}; f.forEach(function(x){ patch[x[0]]=inp[x[0]].value.trim(); }); if(!patch.name){ msg('The business needs a name.',true); return; } await vnet.updateBusiness(ws,patch,'business.update',patch.name); ws.biz=Object.assign(ws.biz,patch); $('bname').textContent=patch.name; msg('Saved.'); })));
   else p.appendChild(vnet.el('div','note','Only the owner and administrators can change these.')); },
 team:async function(){ var p=$('p_team'); p.textContent=''; p.appendChild(vnet.el('h2','','Team')); var ms=await vnet.members(ws), inv=await vnet.invitesFor(ws).catch(function(){return[]});
   var mine=vnet.INVITE_ROLES[ws.role]||[];
   ms.sort(function(a,b){return (a.role==='owner'?0:1)-(b.role==='owner'?0:1)});
   ms.forEach(function(m){ var right=vnet.el('span'); var can=m.uid!==U.uid&&m.role!=='owner'&&(owner||(ws.role==='gm'&&m.role!=='gm')||(ws.role==='supervisor'&&['employee','cook','server','host','kiosk'].indexOf(m.role)>=0));
     if(can){ var sel=document.createElement('select'); sel.style.width='auto'; (vnet.INVITE_ROLES[ws.role]||[]).forEach(function(r){ var o=vnet.el('option','',vnet.ROLE_LABEL[r]); o.value=r; if(r===m.role)o.selected=true; sel.appendChild(o); }); if(!Array.prototype.some.call(sel.options,function(o){return o.value===m.role})){ var o0=vnet.el('option','',vnet.ROLE_LABEL[m.role]||m.role); o0.value=m.role; o0.selected=true; sel.insertBefore(o0,sel.firstChild); }
       sel.onchange=guard(async function(){ await vnet.setRole(ws,m.uid,sel.value); msg('Role changed.'); }); right.appendChild(sel);
       right.appendChild(btn('Remove','ghost',guard(async function(){ if(!confirm('Remove '+(m.name||m.email)+' from this business? They lose access right away.')) return; await vnet.removeMember(ws,m.uid); msg('Removed.'); R.team(); }))); }
     else right.appendChild(vnet.el('span','pill',vnet.ROLE_LABEL[m.role]||m.role));
     p.appendChild(row((m.name||m.email)+(m.uid===U.uid?' (you)':''),m.email,right)); });
   if(inv.length){ p.appendChild(vnet.el('h3','','Waiting to accept')); inv.forEach(function(i){ var x=i.expiresAt&&i.expiresAt.toDate?i.expiresAt.toDate():null; p.appendChild(row(i.email,(vnet.ROLE_LABEL[i.role]||i.role)+(x?' - expires '+x.toLocaleDateString():''),btn('Cancel','ghost',guard(async function(){ await vnet.cancelInvite(ws,i.id); R.team(); })))); }); }
   if(mine.length){ p.appendChild(vnet.el('h3','','Invite someone')); p.appendChild(vnet.el('div','note','They create a Vyro account with this exact email, then accept on their dashboard. Invitations expire after 14 days.'));
     var n=document.createElement('input'); n.placeholder='Name'; var e=document.createElement('input'); e.type='email'; e.placeholder='Email'; var s=document.createElement('select'); mine.forEach(function(r){ var o=vnet.el('option','',vnet.ROLE_LABEL[r]); o.value=r; s.appendChild(o); });
     p.appendChild(n); p.appendChild(e); p.appendChild(s); p.appendChild(btn('Send invitation','',guard(async function(){ await vnet.invite(ws,U,e.value,n.value.trim(),s.value); msg('Invitation sent.'); R.team(); }))); } },
 apps:function(){ var p=$('p_apps'); p.textContent=''; p.appendChild(vnet.el('h2','','Apps for this business')); p.appendChild(vnet.el('div','note','Turning an app off never deletes its data.'));
   vnet.APPS.forEach(function(a){ var on=!!(ws.biz.apps&&ws.biz.apps[a.id]); var right;
     if(!a.live) right=vnet.el('span','pill','Coming soon'); else if(!owner) right=vnet.el('span','pill'+(on?' good':''),on?'On':'Off'); else right=btn(on?'Turn off':'Turn on',on?'ghost':'',guard(async function(){ if(on&&!confirm('Turn off '+a.name+' for this business? Your data stays.')) return; await vnet.setApp(ws,a.id,!on); R.apps(); msg(a.name+(on?' turned off.':' turned on.')); }));
     p.appendChild(row(a.name,a.desc,right)); });
   if(!owner) p.appendChild(vnet.el('div','note','Only the owner can turn apps on or off.')); },
 plan:async function(){ var p=$('p_plan'); p.textContent=''; p.appendChild(vnet.el('h2','','Plan and billing')); var s=admin?await vnet.subscription(ws):null;
   if(!admin){ p.appendChild(vnet.el('div','note','Only the owner and administrators see billing.')); return; }
   p.appendChild(row('Plan',s?(s.note||''):'No plan record yet',vnet.el('span','pill good',s?s.plan+' / '+s.status:'none')));
   var pr=window.VYRO_PRICES||{}; vnet.APPS.filter(function(a){return a.live&&ws.biz.apps&&ws.biz.apps[a.id]}).forEach(function(a){ var v=pr[a.id]; p.appendChild(row(a.name,'Planned price when billing starts',vnet.el('span','pill',v==null?'not set yet':'$'+v+' / month'))); });
   p.appendChild(vnet.el('div','banner','Payments are not switched on. This business is free while Vyro is in launch. When billing starts, each business gets its own plan and its own invoices. Crypto payments will be checked by the server, never trusted from the screen.'));
   p.appendChild(vnet.el('h3','','How a plan moves'));
   p.appendChild(vnet.el('div','note','trialing, active, past due, grace period, suspended, canceled, expired. A missed payment never deletes your data.')); },
 store:async function(){ var p=$('p_store'); p.textContent=''; p.appendChild(vnet.el('h2','','Photo storage')); if(!admin){ p.appendChild(vnet.el('div','note','Only the owner and administrators see storage.')); return; }
   var s=await vnet.storage(ws); var inc=s?s.includedBytes:0, used=s?s.usedBytes:0;
   p.appendChild(row('Planned allowance',vnet.fmtBytes(inc)+' included per business',vnet.el('span','pill',vnet.fmtBytes(used)+' used')));
   var bar=vnet.el('div','bar'); var i=vnet.el('i'); i.style.width=(inc?Math.min(100,used/inc*100):0)+'%'; bar.appendChild(i); p.appendChild(bar);
   p.appendChild(vnet.el('div','banner','Photo uploads are not connected yet. The free database cannot hold photos. When file storage is connected, uploads count against this allowance and you can buy more. You will be warned at 80%, 90% and 100%.')); },
 act:async function(){ var p=$('p_act'); p.textContent=''; p.appendChild(vnet.el('h2','','Activity log')); if(!admin){ p.appendChild(vnet.el('div','note','Only the owner and administrators see the activity log.')); return; }
   var a=await vnet.activity(ws); if(!a.length) p.appendChild(vnet.el('div','note','Nothing yet.')); a.forEach(function(x){ var t=x.at&&x.at.toDate?x.at.toDate().toLocaleString():''; p.appendChild(row(x.action,(x.detail||'')+' - '+(x.byEmail||'')+' - '+t)); }); },
 data:function(){ var p=$('p_data'); p.textContent=''; p.appendChild(vnet.el('h2','','Your data')); if(!admin){ p.appendChild(vnet.el('div','note','Only the owner and administrators can export data.')); return; }
   p.appendChild(vnet.el('div','note','Download everything this business has stored (team, menu, orders, customers, jobs and more) as one file. This reads your data once, so it uses some of the free daily quota.'));
   p.appendChild(btn('Download my business data','',guard(async function(){ msg('Preparing...'); var j=await vnet.exportData(ws); var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([j],{type:'application/json'})); a.download='vyro-'+(ws.biz.name||'business').replace(/[^a-z0-9]+/gi,'-')+'.json'; a.click(); await vnet.audit(ws.id,'data.export',''); msg('Downloaded.'); })));
   if(owner){ p.appendChild(vnet.el('h3','','Close this business'));
     if(ws.biz.status==='closed'){ p.appendChild(btn('Reopen business','',guard(async function(){ await vnet.reopenWorkspace(ws); location.reload(); }))); }
     else{ p.appendChild(vnet.el('div','note','Closing keeps all data but stops your team from using the apps. You can reopen it. Type the business name to confirm.')); var c=document.createElement('input'); c.placeholder='Type the business name'; p.appendChild(c);
       p.appendChild(btn('Close business','danger',guard(async function(){ if(c.value.trim()!==ws.biz.name){ msg('The name does not match.',true); return; } await vnet.closeWorkspace(ws); location.reload(); }))); }
     p.appendChild(vnet.el('div','note','Transferring ownership to someone else is not available yet.')); } }
};
vnet.requireAuth(async function(u){
  U=u; var id=new URLSearchParams(location.search).get('b'); if(!id){ location.replace('dashboard.html'); return; }
  try{ ws=await vnet.getWorkspace(id,u); }catch(e){ $('err').textContent=vnet.friendly(e); return; }
  admin=vnet.isOwnerLevel(ws.role); owner=ws.role==='owner';
  $('bname').textContent=ws.biz.name||'Business'; $('brole').textContent='Your role: '+(vnet.ROLE_LABEL[ws.role]||ws.role); $('closed').classList.toggle('hide',ws.biz.status!=='closed');
  var list=tabs.filter(function(t){ return admin||['over','team','apps'].indexOf(t[0])>=0; });
  list.forEach(function(t){ var b=vnet.el('button','',t[1]); b.type='button'; b.dataset.id=t[0]; b.onclick=function(){ $('err').textContent='';$('msg').textContent=''; show(t[0]); }; $('tabs').appendChild(b); });
  tabs=list; var tq=new URLSearchParams(location.search).get('tab'); show(list.some(function(t){return t[0]===tq})?tq:'over');
});

</script></body></html>
